<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#1a2340"/>
    </linearGradient>
    <linearGradient id="lay-foundation" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b2f6b"/>
      <stop offset="100%" stop-color="#5c4aa8"/>
    </linearGradient>
    <linearGradient id="lay-core" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f4f7a"/>
      <stop offset="100%" stop-color="#2f7bb6"/>
    </linearGradient>
    <linearGradient id="lay-page" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f6e4d"/>
      <stop offset="100%" stop-color="#2faa7a"/>
    </linearGradient>
    <linearGradient id="lay-server" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a4a1a"/>
      <stop offset="100%" stop-color="#c07a2a"/>
    </linearGradient>
    <linearGradient id="lay-app" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a1f4a"/>
      <stop offset="100%" stop-color="#c2407a"/>
    </linearGradient>
    <linearGradient id="lay-adj" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#6a6a6a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9fb4d8"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7e9c"/>
    </marker>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="820" fill="url(#bg)"/>

  <!-- Title -->
  <text x="600" y="46" text-anchor="middle" fill="#e6ecf7" font-size="26" font-weight="600">jsgui3 Ecosystem</text>
  <text x="600" y="70" text-anchor="middle" fill="#9fb4d8" font-size="13">Repos grouped by layer; arrows show primary runtime / build dependencies</text>

  <!-- Layer band labels -->
  <g font-size="12" fill="#9fb4d8">
    <text x="40" y="135">Apps &amp; Sites</text>
    <text x="40" y="265">Page / Site Model</text>
    <text x="40" y="395">Framework Core</text>
    <text x="40" y="525">Server Runtime</text>
    <text x="40" y="655">Foundation</text>
    <text x="40" y="775">Adjacent</text>
  </g>

  <!-- Layer bands -->
  <g opacity="0.18">
    <rect x="20" y="100" width="1160" height="110" rx="10" fill="#c2407a"/>
    <rect x="20" y="230" width="1160" height="110" rx="10" fill="#2faa7a"/>
    <rect x="20" y="360" width="1160" height="110" rx="10" fill="#2f7bb6"/>
    <rect x="20" y="490" width="1160" height="110" rx="10" fill="#c07a2a"/>
    <rect x="20" y="620" width="1160" height="100" rx="10" fill="#5c4aa8"/>
    <rect x="20" y="730" width="1160" height="60"  rx="10" fill="#6a6a6a"/>
  </g>

  <!-- Helper card style via groups -->
  <!-- ============ Apps & Sites (top) ============ -->
  <g filter="url(#card-shadow)">
    <rect x="160" y="120" width="180" height="70" rx="10" fill="url(#lay-app)"/>
    <text x="250" y="148" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">jsgui3-simple-example</text>
    <text x="250" y="170" text-anchor="middle" fill="#f4d6e3" font-size="11">minimal SSR + activation demo</text>
  </g>
  <g filter="url(#card-shadow)">
    <rect x="360" y="120" width="180" height="70" rx="10" fill="url(#lay-app)"/>
    <text x="450" y="148" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">jsgui3-own-website</text>
    <text x="450" y="170" text-anchor="middle" fill="#f4d6e3" font-size="11">project's own site</text>
  </g>
  <g filter="url(#card-shadow)">
    <rect x="560" y="120" width="180" height="70" rx="10" fill="url(#lay-app)"/>
    <text x="650" y="148" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">jsgui3-designer</text>
    <text x="650" y="170" text-anchor="middle" fill="#f4d6e3" font-size="11">visual control designer</text>
  </g>
  <g filter="url(#card-shadow)">
    <rect x="760" y="120" width="200" height="70" rx="10" fill="url(#lay-app)"/>
    <text x="860" y="148" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">jsgui3-agents-flowcharts</text>
    <text x="860" y="170" text-anchor="middle" fill="#f4d6e3" font-size="11">agent flow visualizations</text>
  </g>

  <!-- ============ Page / Site Model ============ -->
  <g filter="url(#card-shadow)">
    <rect x="360" y="250" width="200" height="70" rx="10" fill="url(#lay-page)"/>
    <text x="460" y="278" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">jsgui3-website</text>
    <text x="460" y="300" text-anchor="middle" fill="#d6f0e3" font-size="11">Website + resolved page model</text>
  </g>
  <g filter="url(#card-shadow)">
    <rect x="600" y="250" width="200" height="70" rx="10" fill="url(#lay-page)"/>
    <text x="700" y="278" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">jsgui3-webpage</text>
    <text x="700" y="300" text-anchor="middle" fill="#d6f0e3" font-size="11">Webpage primitive + metadata</text>
  </g>

  <!-- ============ Framework Core ============ -->
  <g filter="url(#card-shadow)">
    <rect x="220" y="380" width="200" height="70" rx="10" fill="url(#lay-core)"/>
    <text x="320" y="408" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">jsgui3-html</text>
    <text x="320" y="430" text-anchor="middle" fill="#d6e6f5" font-size="11">isomorphic controls + SSR</text>
  </g>
  <g filter="url(#card-shadow)">
    <rect x="500" y="380" width="200" height="70" rx="10" fill="url(#lay-core)"/>
    <text x="600" y="408" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">jsgui3-client</text>
    <text x="600" y="430" text-anchor="middle" fill="#d6e6f5" font-size="11">browser bootstrap + activation</text>
  </g>

  <!-- ============ Server Runtime ============ -->
  <g filter="url(#card-shadow)">
    <rect x="450" y="510" width="300" height="80" rx="10" fill="url(#lay-server)"/>
    <text x="600" y="540" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">jsgui3-server</text>
    <text x="600" y="562" text-anchor="middle" fill="#fbe6cf" font-size="11">HTTP server, publishers, bundlers,</text>
    <text x="600" y="578" text-anchor="middle" fill="#fbe6cf" font-size="11">serve_site, generated client entries</text>
  </g>

  <!-- ============ Foundation ============ -->
  <g filter="url(#card-shadow)">
    <rect x="420" y="640" width="160" height="70" rx="10" fill="url(#lay-foundation)"/>
    <text x="500" y="668" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">lang-tools</text>
    <text x="500" y="690" text-anchor="middle" fill="#e0d6f5" font-size="11">data models, evented</text>
  </g>
  <g filter="url(#card-shadow)">
    <rect x="620" y="640" width="160" height="70" rx="10" fill="url(#lang-foundation, url(#lay-foundation))"/>
    <text x="700" y="668" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">lang-mini</text>
    <text x="700" y="690" text-anchor="middle" fill="#e0d6f5" font-size="11">utilities + type system</text>
  </g>

  <!-- ============ Adjacent ============ -->
  <g filter="url(#card-shadow)">
    <rect x="500" y="740" width="200" height="40" rx="8" fill="url(#lay-adj)"/>
    <text x="600" y="765" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">jsgui3-gfx-core</text>
  </g>

  <!-- ============ Coordination badge ============ -->
  <g filter="url(#card-shadow)">
    <rect x="980" y="640" width="180" height="70" rx="10" fill="#1f3258" stroke="#3a5a8c"/>
    <text x="1070" y="668" text-anchor="middle" fill="#e6ecf7" font-size="13" font-weight="600">coordination</text>
    <text x="1070" y="690" text-anchor="middle" fill="#9fb4d8" font-size="11">cross-repo plans, policy</text>
  </g>

  <!-- ============ Edges ============ -->
  <g fill="none" stroke="#9fb4d8" stroke-width="1.5" marker-end="url(#arrow)">
    <!-- Apps -> Page/Site or Server -->
    <path d="M250,190 C250,220 460,230 460,250"/>           <!-- simple-example -> website? actually -> server. redirect -->
    <path d="M450,190 C450,220 460,230 460,250"/>           <!-- own-website -> website -->
    <path d="M650,190 C650,220 700,230 700,250"/>           <!-- designer -> webpage -->
    <path d="M860,190 C860,300 760,470 700,510"/>           <!-- agents-flowcharts -> server -->

    <!-- Apps -> server (simple-example, designer also use server directly) -->
    <path d="M250,190 C250,360 470,490 500,510"/>
    <path d="M650,190 C650,330 600,360 600,380"/>           <!-- designer -> jsgui3-html -->

    <!-- Page/Site -> Core -->
    <path d="M460,320 C460,350 360,360 360,380"/>           <!-- website -> jsgui3-html -->
    <path d="M700,320 C700,350 600,360 600,380"/>           <!-- webpage -> jsgui3-client (composes html structure) -->
    <path d="M460,320 C460,360 540,360 540,380"/>           <!-- website -> jsgui3-client (resolved client_js / client_controls) -->

    <!-- Page/Site -> Server (server consumes resolved model) -->
    <path d="M460,320 C460,420 540,490 560,510"/>
    <path d="M700,320 C700,420 660,490 640,510"/>

    <!-- Core -> Foundation -->
    <path d="M320,450 C320,560 500,620 500,640"/>           <!-- jsgui3-html -> lang-tools -->
    <path d="M600,450 C600,560 700,620 700,640"/>           <!-- jsgui3-client -> lang-mini (via lang-tools) -->

    <!-- Server -> Core (server bundles client + composes html) -->
    <path d="M520,510 C520,490 360,470 340,450"/>           <!-- server -> jsgui3-html -->
    <path d="M680,510 C680,490 620,470 620,450"/>           <!-- server -> jsgui3-client -->

    <!-- Foundation chain -->
    <path d="M580,675 L620,675"/>                           <!-- lang-tools -> lang-mini -->
  </g>

  <!-- Soft edges: adjacent and coordination -->
  <g fill="none" stroke="#6e7e9c" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arrow-soft)">
    <path d="M600,740 C600,720 600,720 600,710"/>          <!-- gfx-core feeds canvases (optional) -->
    <path d="M980,675 C900,675 800,675 780,675"/>          <!-- coordination references foundation/all -->
    <path d="M1070,640 C1070,540 760,540 750,540"/>        <!-- coordination references server -->
    <path d="M1070,640 C1070,300 800,290 800,285"/>        <!-- coordination references page/site model -->
  </g>

  <!-- Legend -->
  <g transform="translate(40,750)">
    <rect x="0" y="0" width="380" height="40" rx="6" fill="#0f1729" stroke="#3a5a8c"/>
    <g font-size="11" fill="#cdd9ee">
      <line x1="12" y1="14" x2="40" y2="14" stroke="#9fb4d8" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="48" y="18">depends on / consumes</text>
      <line x1="180" y1="14" x2="208" y2="14" stroke="#6e7e9c" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arrow-soft)"/>
      <text x="216" y="18">references / coordinates</text>
      <text x="12" y="34">Layers (top → bottom): apps · pages · core · server · foundation</text>
    </g>
  </g>
</svg>
